allowBuilds:
    "@parcel/watcher": false
    esbuild: false
    lefthook: true
    msw: false
    unrs-resolver: false
ignoredBuiltDependencies:
    - esbuild
    - msw
minimumReleaseAge: 0
onlyBuiltDependencies:
    - unrs-resolver
overrides:
    # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr via istanbul/minimatch. Remove when parents pull patched brace-expansion.
    brace-expansion@^5: 5.0.13
    # GHSA-m5mm-p8h7-m29v: @rollup/plugin-terser allows serialize-javascript ^7.0.3. Remove when it depends on >=7.1.3.
    serialize-javascript: 7.1.4
    # GHSA-3g3m-2fjr-6pw4: no patched glob 10/13; 14.0.2+ is the fix. Remove when test-exclude/istanbul depend on glob >=14.0.2.
    glob: 14.0.6
    # GHSA-g3hv-75wg-m249: no patched minimatch 9/10; 11.0.1+ is the fix. Remove when parents depend on minimatch >=11.0.1.
    minimatch: 11.0.9
